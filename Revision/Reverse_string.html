<script>

    let string = "String"
    console.log(`The string is ${string}`);
    const reverse = (o) => {
        let r=""

        for(let i = o.length-1 ; i >=0  ; i--){

            r += o[i]

        }

        return r


    }

    let reversed_string = reverse(string)
    console.log(`The reversed string is ${reversed_string}`);
    

</script>
