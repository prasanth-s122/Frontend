<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
</head>

<body>

    <h1>Welcome to Dashboard</h1>

    <button id="logoutBtn">
        Logout

    <script>

        const logoutBtn =

            alert("Logged Out");

            window.location.href = "../pending.html";

        });

    </script>

</body>

</html>
